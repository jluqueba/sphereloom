name: Feature request
description: Suggest an improvement or new capability for SphereLoom.
title: "feat: "
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like SphereLoom to provide.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: >-
        Which part of SphereLoom does this concern? Each choice matches one `area:` label,
        so triage can apply it as is.
      options:
        - OSC Wi-Fi backend
        - USB Camera SDK backend
        - Media SDK processing
        - MCP tools and server
        - Fake camera and fixtures
        - Security
        - Long-running jobs
        - Example agent
        - Developer tooling
        - CI and merge checks
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: vendor-capability
    attributes:
      label: Does this require a vendor capability that may not exist?
      description: For example, OSC does not support live preview, streaming, or exposure adjustment.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or different designs you considered.
    validations:
      required: false
  - type: dropdown
    id: contribute
    attributes:
      label: Willingness to contribute
      options:
        - I can open a pull request
        - I can help test
        - I can help with docs
        - I cannot contribute right now
    validations:
      required: true
