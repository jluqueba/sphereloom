# Continuous integration.
#
# Design notes, because the shape of this file is deliberate:
#
# * Pull requests only. A merge lands the exact tree that was already validated, so running
#   again on `main` would burn minutes to re-prove the same thing.
# * One status check for everything CI runs, `ci-gate`, which the ruleset requires. It
#   always reports, even when the heavy jobs are skipped for a documentation-only change,
#   so a required check never hangs pending. The other required check,
#   `copilot-review-gate`, comes from its own workflow (ADR-0019).
# * Permissions start empty and are granted per job.
# * Every action is pinned to a full commit SHA, with its release in a trailing comment, so
#   a moved or compromised tag cannot change what runs. Dependabot updates both together,
#   and tests/unit/test_codebase_rules.py rejects an unpinned `uses:`.
# * Checks run with `--no-sync` against an environment installed in an explicit step, so a
#   check can never silently re-resolve dependencies mid-run.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new uv release cannot change dependency resolution mid-review.
  UV_VERSION: "0.12.22"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A file counts for a filter when it matches a pattern and no negated one. The
          # default quantifier treats a negation as one more alternative, so it excludes
          # nothing.
          predicate-quantifier: some-with-excludes
          filters: |
            # The test matrix runs for every change except an explicit list of paths no
            # test reads. A skip-list rather than an allow-list fails closed: a new file
            # or directory runs the tests that would reject it. Adding an exclusion is a
            # deliberate decision, enforced by tests/unit/test_ci_paths.py.
            code:
              - '**'
              - '!docs/internal/**'
              - '!.github/instructions/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/copilot-instructions.md'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
              - '!.github/CODEOWNERS'
              - '!.github/dependabot.yml'
              - '!.markdownlint.json'
              - '!.markdownlint-cli2.jsonc'
            docs:
              - '**/*.md'
              - '.markdownlint.json'
              - '.markdownlint-cli2.jsonc'
              # docs/internal is encrypted at rest, so there is nothing a linter can read.
              - '!docs/internal/**'

  check:
    name: Check (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Create environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install project
        run: uv pip install -e ".[dev]"

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Typecheck
        run: uv run --no-sync mypy

      # The hardware tier needs a real camera, so it is deselected here and can never run
      # accidentally in CI. See ADR-0007.
      - name: Test
        run: uv run --no-sync pytest -m "not hardware" --cov --cov-report=term-missing

  docs:
    name: Lint documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  ci-gate:
    # The required status check for everything this workflow runs. It depends on every other
    # job and passes only on an allow-list of results, never a deny-list. Searching for
    # "failure" or "cancelled" fails open: it passed on an empty or malformed result set,
    # and on any result outside the pair it named.
    #
    # * Change detection must itself succeed. A skipped heavy job is legitimate only when
    #   the filter ran and decided the area was untouched.
    # * Every other job must report "success", or "skipped" because the change did not
    #   touch that area.
    # * Anything unreadable fails: jq exits non-zero on malformed input, and an empty
    #   object fails explicitly because `all` over nothing is true.
    name: ci-gate
    needs: [changes, check, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if ! echo "$RESULTS" | jq -e '
            type == "object"
            and length > 0
            and .changes.result == "success"
            and all(.[]; .result == "success" or .result == "skipped")
          ' > /dev/null; then
            echo "::error::One or more CI jobs did not succeed."
            exit 1
          fi
          echo "All required jobs succeeded or were legitimately skipped."

